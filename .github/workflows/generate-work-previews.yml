name: Build Our Work showcase
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'scripts/build-work.js'
      - '.github/workflows/generate-work-previews.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Build showcase and capture previews
        run: node scripts/build-work.js
      - name: Commit site and previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css assets/*.jpg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add 10-project Our Work showcase"
            git push
          fi
