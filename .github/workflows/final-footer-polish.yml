name: Final footer polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace fragile icon CDN and copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          block = '''<div class="social-links" aria-label="The Pixel Muses social media">
          <a href="https://www.linkedin.com/company/the-pixel-muses/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" title="LinkedIn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 8.1H3.1V21h3.4V8.1ZM4.8 3A2 2 0 1 0 4.8 7 2 2 0 0 0 4.8 3ZM21 13.6c0-3.9-2.1-5.8-4.9-5.8-2.3 0-3.3 1.3-3.9 2.2V8.1H8.8V21h3.4v-6.4c0-1.7.3-3.3 2.4-3.3 2 0 2 1.9 2 3.4V21H21v-7.4Z"/></svg><span>LinkedIn</span></a>
          <a href="https://www.instagram.com/thepixelmuses/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1"></circle></svg><span>Instagram</span></a>
          <a href="https://www.facebook.com/profile.php?id=61557869420013" target="_blank" rel="noopener noreferrer" aria-label="Facebook" title="Facebook"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 8h3V4.5c-.5-.1-1.9-.2-3.6-.2C9.8 4.3 7.8 6.2 7.8 10v2H4.5v3.8h3.3V22h4v-6.2h3.4l.5-3.8h-3.9v-1.8c0-1.1.3-2.2 2.2-2.2Z"/></svg><span>Facebook</span></a>
          <a href="https://www.threads.com/@thepixelmuses" target="_blank" rel="noopener noreferrer" aria-label="Threads" title="Threads"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.8 11.1c-.2-3.6-2.2-5.7-5.9-5.7-3.9 0-6.2 2.2-6.2 5.3 0 3.2 2.3 5.2 5.9 5.2 2.1 0 3.7-.8 4.5-2.3.6-1.2.1-2.5-1.1-3-1.4-.6-3.3-.1-3.3 1.3 0 .8.6 1.3 1.5 1.3 1.7 0 2.6-1.5 2.6-3.8 0-3.1-1.7-4.9-4.1-4.9-2.5 0-4.1 1.5-4.1 3.9 0 2.4 1.7 3.9 4.3 3.9 1.2 0 2.2-.3 3-.9"/></svg><span>Threads</span></a>
          <a href="https://x.com/thepixelmuses" target="_blank" rel="noopener noreferrer" aria-label="X" title="X"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.8 3H22l-7 8 8 10h-6.2l-4.9-6.1L6.5 21H3.3l7-8L2.6 3H9l4.5 5.6L18.8 3Zm-1.1 16.2h1.7L7 4.7H5.2l12.5 14.5Z"/></svg><span>X</span></a>
        </div>'''
          s = re.sub(r'<div class="social-links" aria-label="The Pixel Muses social media">.*?</div>', block, s, count=1, flags=re.S)
          s = s.replace('Move across a project to expand it. Click to open the live demo.', 'Move across a project to expand it. Click to open the case study.')
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/final-footer-polish.yml
          git add index.html
          git commit -m "Polish footer icons and work copy"
          git push
