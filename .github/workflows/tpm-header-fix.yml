name: TPM Header Fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tpm-header-fix.yml'
permissions:
  contents: write
jobs:
  patch-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch header CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('styles.css')
          s=p.read_text()
          marker='/* TPM APPROVED HEADER */'
          if marker not in s:
              s += '''\n/* TPM APPROVED HEADER */\n.site-header .nav{height:96px;gap:30px}\n.site-header .brand{gap:14px}\n.site-header .brand-mark,.site-header .brand-mark img{width:60px;height:60px}\n.site-header .brand-mark{flex-basis:60px}\n.site-header .brand-copy strong{font-size:20px;letter-spacing:.035em;white-space:nowrap}\n.site-header .brand-copy small{font-size:7px;letter-spacing:.16em;margin-top:6px;white-space:nowrap}\n.site-header .primary-nav{gap:27px;font-size:13px;align-items:center}\n.site-header .primary-nav>a:nth-child(1)::after,.site-header .primary-nav>a:nth-child(2)::after{content:'⌄';display:inline-block;margin-left:8px;color:#c9c5bc;font-size:11px;line-height:1;transform:translateY(-1px)}\n.site-header .nav>.button{min-height:54px;padding:0 22px;font-size:12px;white-space:nowrap}\n@media(max-width:1100px){.site-header .nav{gap:18px}.site-header .primary-nav{gap:16px;font-size:12px}.site-header .nav>.button{padding:0 17px}.site-header .brand-copy strong{font-size:18px}.site-header .brand-mark,.site-header .brand-mark img{width:56px;height:56px}.site-header .brand-mark{flex-basis:56px}}\n@media(max-width:760px){.site-header .nav{height:72px}.site-header .brand-mark,.site-header .brand-mark img{width:50px;height:50px}.site-header .brand-mark{flex-basis:50px}.site-header .brand-copy strong{font-size:16px}.site-header .brand-copy small{font-size:6.5px}.site-header .primary-nav>a:nth-child(1)::after,.site-header .primary-nav>a:nth-child(2)::after{display:none}}\n'''
              p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles.css
          git diff --cached --quiet || git commit -m 'Match approved header layout and dropdown indicators'
          git push
