name: Apply mobile work layout fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Apply mobile work layout fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append mobile portfolio styles
        shell: bash
        run: |
          cat >> styles.css <<'CSS'

/* Mobile portfolio: stacked editorial cards */
@media (max-width: 767px){
  .work-showcase{overflow:visible;padding-bottom:72px}
  .work-intro{padding-bottom:8px}
  .work-stage{height:auto;margin-top:8px}
  .work-stage-head{height:42px;padding-top:4px}
  .work-panels{position:static;display:flex;flex-direction:column;gap:16px;height:auto;padding:0 16px;overflow:visible}
  .work-project,.work-project.is-active{flex:0 0 auto;width:100%;height:430px;min-height:430px;border-color:#34342f;cursor:pointer;transition:none}
  .work-project-link{height:100%;width:100%}
  .work-project-media img,.work-project.is-active .work-project-media img,.work-project:not(.is-active) .work-project-media img{transform:scale(1);filter:saturate(.82) brightness(.72);transition:none}
  .work-project-shade,.work-project:not(.is-active) .work-project-shade{background:linear-gradient(180deg,rgba(5,5,4,.08) 0%,rgba(5,5,4,.16) 32%,rgba(5,5,4,.82) 100%)}
  .work-project-info{padding:22px 22px 24px}
  .work-project-meta{gap:5px}
  .work-project-meta span,.work-project:not(.is-active) .work-project-meta span{writing-mode:initial;transform:none;color:var(--gold);font-size:12px;letter-spacing:.12em}
  .work-project-meta small,.work-project.is-active .work-project-meta small{opacity:1;transform:none;font-size:8px;letter-spacing:.14em;color:#dedbd3}
  .work-project-bottom,.work-project.is-active .work-project-bottom{opacity:1;transform:none;align-items:flex-end;gap:16px}
  .work-project-bottom h3{font-size:34px;line-height:1.02;margin:0 0 9px}
  .work-project-bottom p{font-size:12px;line-height:1.5;max-width:calc(100vw - 118px);color:#d3d0c8}
  .work-project-arrow{width:42px;height:42px;font-size:17px}
  .work-stage-foot{height:auto;display:block;padding:20px 16px 0}
  .work-stage-foot>span:first-child{display:none}
  .work-stage-hint{font-size:9px;color:#77746d}
}

@media (max-width: 430px){
  .work-panels{padding:0 14px;gap:14px}
  .work-project,.work-project.is-active{height:390px;min-height:390px}
  .work-project-info{padding:19px 19px 21px}
  .work-project-bottom h3{font-size:30px}
  .work-project-bottom p{font-size:11px;max-width:calc(100vw - 100px)}
}
CSS
      - name: Commit mobile styles
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git diff --cached --quiet && exit 0
          git commit -m "Apply mobile work layout fix"
          git push
