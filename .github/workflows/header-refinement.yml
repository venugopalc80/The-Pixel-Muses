name: Header refinement

on:
  push:
    branches: [main]

jobs:
  refine-header:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refine navigation and CTA
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text()
          marker = '/* TPM HEADER REFINEMENT v1 */'
          if marker not in s:
              s += r'''\n\n/* TPM HEADER REFINEMENT v1 */\n(function(){\n  const style=document.createElement('style');\n  style.textContent=`\n    .site-header .primary-nav{gap:25px;color:#d5d2c9}\n    .site-header .primary-nav a,.site-header .nav-drop-trigger{color:#d5d2c9}\n    .site-header .primary-nav a:hover,.site-header .nav-drop-trigger:hover{color:#f1efe9}\n    .site-header .nav>.button.button-outline{background:#f1efe9;color:#171714;border-color:#f1efe9}\n    .site-header .nav>.button.button-outline:hover{background:#fffdf7;color:#171714;border-color:#fffdf7;transform:translateY(-1px)}\n    .site-header .nav>.button.button-outline span{color:#80663e}\n    @media(max-width:1100px){.site-header .primary-nav{gap:17px}}\n  `;\n  document.head.appendChild(style);\n})();\n(function(){\n  const links=[...document.querySelectorAll('.primary-nav a')];\n  const pricing=links.find(a=>a.textContent.trim().toLowerCase()==='pricing');\n  if(pricing){pricing.textContent='Work With Us';pricing.href='pricing.html';}\n})();\n'''
              p.write_text(s)
          PY
      - name: Commit refinement
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "Refine header CTA and navigation"
          git push
