name: Work showcase refinement

on:
  push:
    branches: [main]

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Refine work showcase
        shell: python
        run: |
          from pathlib import Path

          script = Path('script.js').read_text()
          old = "img.src=`assets/work-card/${String(i+1).padStart(2,'0')}-${names[i]}.svg`"
          new = "img.src=`assets/${String(i+1).padStart(2,'0')}-${names[i]}.jpg`"
          if old in script:
              script = script.replace(old, new)
              Path('script.js').write_text(script)

          styles = Path('styles.css').read_text()
          marker = '/* TPM WORK SHAPE REFINEMENT */'
          if marker not in styles:
              styles += '''\n\n/* TPM WORK SHAPE REFINEMENT */\n.work-panels{gap:4px}\n.work-project{flex-basis:7.33%;border-color:#34342f}\n.work-project.is-active{flex-basis:34%;border-color:#806f55}\n.work-project-media{opacity:1}\n.work-project:not(.is-active) .work-project-media{opacity:.82}\n.work-project:not(.is-active) .work-project-media img{filter:saturate(.82) brightness(.78);transform:scale(1.035)}\n.work-project.is-active .work-project-media img{filter:saturate(.98) brightness(1.02);transform:scale(1.01)}\n.work-project-shade{background:linear-gradient(180deg,rgba(5,5,4,.02) 0%,rgba(5,5,4,.08) 48%,rgba(5,5,4,.62) 100%)}\n.work-project:not(.is-active) .work-project-shade{background:linear-gradient(180deg,rgba(5,5,4,.08) 0%,rgba(5,5,4,.26) 100%)}\n.work-project-info{padding:24px 25px}\n.work-project.is-active .work-project-info{padding:26px 28px}\n.work-project.is-active .work-project-bottom{max-width:700px}\n.work-project.is-active .work-project-bottom h3{font-size:clamp(28px,2.5vw,40px)}\n.work-project.is-active .work-project-bottom p{max-width:540px}\n@media(max-width:900px){.work-project{flex-basis:8%}.work-project.is-active{flex-basis:38%}}\n@media(max-width:760px){.work-project,.work-project.is-active{flex-basis:auto}.work-project:not(.is-active) .work-project-media{opacity:1}}\n'''
              Path('styles.css').write_text(styles)

          workflow = Path('.github/workflows/work-shape-refinement.yml')
          workflow.unlink()

      - name: Commit refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js styles.css .github/workflows/work-shape-refinement.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refine work showcase shape and imagery'
          git push
