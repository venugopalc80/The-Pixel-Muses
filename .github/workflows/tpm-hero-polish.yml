name: TPM hero polish

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/tpm-hero-polish.yml'
      - 'styles.css'
      - 'index.html'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine homepage hero
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('We build digital experiences that <em>move businesses forward.</em>', 'Websites that <em>work harder for your business.</em>')
          s = s.replace('Websites, digital growth, software and intelligent systems — designed around your business, your customers and what you need next.', 'We design and build websites, digital growth systems, software and AI solutions that help businesses get found, win customers and operate better.')
          s = s.replace('<span>REMOTE DELIVERY</span>', '<span>WORKING GLOBALLY</span>')
          s = s.replace('<span class="stack-kicker">DIGITAL BUILD</span><strong>From first idea<br>to <em>live product.</em></strong><p>Strategy → Design → Development → Growth</p>', '<span class="stack-kicker">DIGITAL EXPERIENCE</span><strong>From first click<br>to <em>customer.</em></strong><p>Strategy → Website → Search → Conversion</p>')
          s = s.replace('<span>WEBSITES</span><span>SEARCH</span><span>SOFTWARE</span><span>AI</span>', '<span>WEBSITE</span><span>SEARCH</span><span>CONVERSION</span><span>SYSTEMS</span>')
          p.write_text(s)
          p = Path('styles.css')
          s = p.read_text()
          polish = r'''
/* TPM hero polish */
.site-header .nav{height:78px}
.site-header .brand-mark,.site-header .brand-mark img{width:56px;height:56px}
.site-header .brand-mark{flex-basis:56px}
.site-header .brand-copy strong{font-size:19px}
.site-header .primary-nav{gap:24px}
.site-header .nav>.button{min-height:48px;padding:0 21px}
.hero{min-height:calc(100vh - 78px)}
.hero-inner{min-height:calc(100vh - 78px);gap:62px;padding:62px 0}
.hero h1{max-width:720px;font-size:clamp(48px,5.65vw,80px);line-height:1.01}
.hero-lead{max-width:600px;font-size:16px;line-height:1.65;margin:24px 0 30px}
.hero-trust{margin-top:40px}
.hero-stack{width:min(100%,500px);min-height:460px}
.stack-main strong{font-size:clamp(40px,4.2vw,60px)}
@media(max-width:1100px){
.site-header .nav{height:76px}
.hero{min-height:calc(100vh - 76px)}
.hero-inner{min-height:calc(100vh - 76px);gap:44px;padding:52px 0}
.hero h1{font-size:clamp(46px,5.7vw,70px)}
}
@media(max-width:760px){
.site-header .nav{height:72px}
.hero{min-height:auto}
.hero-inner{min-height:auto;grid-template-columns:1fr;gap:42px;padding:64px 0 72px}
.hero h1{font-size:clamp(46px,12vw,66px);max-width:680px}
.hero-lead{font-size:15px;max-width:560px}
.hero-trust{margin-top:34px;flex-wrap:wrap;gap:10px}
.hero-visual{justify-content:stretch}
.hero-stack{width:100%;min-height:390px}
}
@media(max-width:430px){
.hero-inner{padding-top:52px}
.hero h1{font-size:clamp(43px,12.8vw,58px)}
.hero-actions .button{width:100%}
.hero-stack{min-height:350px;padding:20px}
.stack-main{left:20px;right:20px}
.stack-lines{left:20px;right:20px;bottom:20px}
}
'''
          if '/* TPM hero polish */' not in s:
              s += '\n' + polish + '\n'
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html styles.css
          git diff --cached --quiet && exit 0
          git commit -m 'Refine homepage hero hierarchy'
          git push
